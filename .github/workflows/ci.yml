name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Compile
        run: python -m compileall backend/app tests tools reasoning retrieval agent_hub
      - name: Pytest
        run: python -m pytest -q
      - name: Integrity report
        run: |
          python -c "import sys; sys.path.insert(0, 'backend'); sys.path.insert(0, '.'); from app import integrity_checker, schema_validator; r = integrity_checker.build_integrity_report(); s = schema_validator.summarize_schema_validation(); assert r['ok'], r['checks']; assert s['all_valid'], s; print('integrity + schema OK')"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend deps
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build
